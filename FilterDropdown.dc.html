<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/andalusian-cromarium-v2-design-system-5ce69703-3e46-4291-805c-af6d4bfb71b6/tokens/colors.css">
<link rel="stylesheet" href="ds/andalusian-cromarium-v2-design-system-5ce69703-3e46-4291-805c-af6d4bfb71b6/tokens/spacing.css">
<link rel="stylesheet" href="ds/andalusian-cromarium-v2-design-system-5ce69703-3e46-4291-805c-af6d4bfb71b6/tokens/effects.css">
</helmet>
<div ref="{{ rootRef }}" style="position:relative;font-family:var(--font-sans);flex-shrink:0;width:{{ rootW }};">
  <button onClick="{{ toggle }}" style="display:inline-flex;align-items:center;justify-content:{{ jc }};gap:8px;width:{{ btnW }};height:{{ h }};padding:0 14px;border-radius:var(--radius-pill);border:1px solid {{ bd }};background:{{ bg }};color:{{ fg }};font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-sans);white-space:nowrap;box-shadow:{{ sh }};backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);transition:background .18s var(--ease-out),border-color .18s var(--ease-out);">
    <span style="display:inline-flex;align-items:center;gap:7px;min-width:0;overflow:hidden;">
      <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ false }}"><span style="opacity:.6;font-weight:600;flex-shrink:0;">{{ label }}</span></sc-if>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ value }}</span>
    </span>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;opacity:.75;transform:rotate({{ rot }});transition:transform .22s var(--ease-out);"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;z-index:70;top:calc(100% + 7px);left:{{ menuLeft }};right:{{ menuRight }};min-width:{{ menuMin }};max-height:288px;overflow-y:auto;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px -18px rgba(14,26,77,.42);padding:6px;" class="noscroll">
      <sc-for list="{{ opts }}" as="o" hint-placeholder-count="4">
        <button onClick="{{ o.choose }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border:none;background:{{ o.bg }};border-radius:10px;cursor:pointer;font-family:var(--font-sans);font-size:13.5px;font-weight:{{ o.fw }};color:{{ o.fg }};text-align:left;">
          <span>{{ o.name }}</span>
          <sc-if value="{{ o.sel }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--chroma-fuchsia)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M20 6L9 17l-5-5"/></svg></sc-if>
        </button>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:44},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Filtro&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Todos&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;align&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;left&quot;,&quot;right&quot;],&quot;default&quot;:&quot;left&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;block&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:42,&quot;tsType&quot;:&quot;number&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{name:string;sel:boolean;pick:()=&gt;void}&gt;&quot;}}">
class Component extends DCLogic {
  state = { open:false };
  componentDidMount(){
    this._h = (e)=>{ if(this.state.open && this._root && !this._root.contains(e.target)) this.setState({open:false}); };
    document.addEventListener('mousedown', this._h, true);
  }
  componentWillUnmount(){ document.removeEventListener('mousedown', this._h, true); }
  renderVals(){
    const active = !!this.props.active;
    const block = !!this.props.block;
    const dark = !!this.props.dark;
    const h = (this.props.height || 42) + 'px';
    const open = this.state.open;
    const opts = (this.props.options||[]).map(o=>({
      name:o.name, sel:!!o.sel,
      choose:()=>{ if(o.pick) o.pick(); this.setState({open:false}); },
      bg: o.sel ? 'var(--mist)' : 'transparent',
      fg: o.sel ? 'var(--navy-900)' : 'var(--navy-700)',
      fw: o.sel ? '700' : '500',
    }));
    return {
      label: this.props.label || '',
      value: this.props.value || '',
      open, opts,
      hasLabel: !!(this.props.label),
      rot: open ? '180deg' : '0deg',
      rootW: block ? '100%' : 'auto',
      btnW: block ? '100%' : 'auto',
      jc: block ? 'space-between' : 'flex-start',
      h: h,
      menuMin: block ? '100%' : '186px',
      menuLeft: block ? '0' : (this.props.align==='right' ? 'auto' : '0'),
      menuRight: block ? '0' : (this.props.align==='right' ? '0' : 'auto'),
      toggle: ()=>this.setState(s=>({open:!s.open})),
      rootRef: (el)=>{ this._root = el; },
      bd: active ? 'transparent' : (dark ? 'rgba(255,255,255,.3)' : 'var(--line)'),
      bg: active ? 'var(--gradient-prism)' : (dark ? 'rgba(255,255,255,.14)' : 'var(--glass-fill-strong)'),
      fg: active ? '#fff' : (dark ? '#fff' : 'var(--navy-700)'),
      sh: active ? '0 8px 20px -10px rgba(233,92,198,.55)' : (dark ? 'none' : 'var(--shadow-xs)'),
    };
  }
}
</script>
</body>
</html>
